# Optional local hooks. Install them with `pre-commit install`.
#
# Nothing here is required to contribute: CI runs the same checks through the
# Makefile (`make check`). The hooks only catch problems before they are
# committed. Revisions are pinned to commit SHAs, like the CI actions;
# `pre-commit autoupdate --freeze` keeps them that way.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: ["--fix=lf"]
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: detect-private-key
      # README screenshots are welcome; anything bigger than this belongs in a
      # release asset, not in the history.
      - id: check-added-large-files
        args: ["--maxkb=1024"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 25bcf95026b96e2dd3c0aec3090c3d6ef6ca2e6c # frozen: v0.17.3
    hooks:
      # Same rules as `make lint` (see the Makefile for what each one catches).
      # pre-commit recognises bin/switchboard as Python by its shebang.
      - id: ruff-check
        args: ["--isolated", "--target-version", "py39", "--select", "E9,F,FA102"]

  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e # frozen: v8.30.1
    hooks:
      - id: gitleaks
        args: ["--ignore-gitleaks-allow"]
